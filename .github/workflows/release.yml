name: Release

on:
  push:
    tags:
      - "v*"
  # Re-run a release for an existing tag, e.g. when a publish step failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.4.0
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  npm:
    runs-on: ubuntu-latest
    # npm trusted publishing: GitHub's OIDC token proves who publishes, so no NPM_TOKEN to expire.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm publish --access public --loglevel verbose

  docker-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: drumsergio
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        run: echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          tags: drumsergio/ghost-github-portfolio:${{ steps.version.outputs.tag }}-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  docker-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: drumsergio
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        run: echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/arm64
          tags: drumsergio/ghost-github-portfolio:${{ steps.version.outputs.tag }}-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  docker-manifest:
    runs-on: ubuntu-latest
    needs: [docker-amd64, docker-arm64]
    steps:
      - uses: docker/login-action@v4
        with:
          username: drumsergio
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        run: echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"
      - run: |
          docker buildx imagetools create \
            -t drumsergio/ghost-github-portfolio:${{ steps.version.outputs.tag }} \
            drumsergio/ghost-github-portfolio:${{ steps.version.outputs.tag }}-amd64 \
            drumsergio/ghost-github-portfolio:${{ steps.version.outputs.tag }}-arm64

  github-release:
    runs-on: ubuntu-latest
    needs: [npm, docker-manifest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
